// deviceToken：你的 Autoblow API 裝置 Token。
// 此 Token 會包含在每個傳送到橋接程式（埠號 28777）的 UDP 訊息中。
// 橋接程式會從訊息中讀取它，因此只需要在此處設定即可。
// 如果想在橋接程式中使用環境變數 DEVICE_TOKEN，可將此處留空。
deviceToken=14

// strokeMin：裝置行程下限（0–100）。預設值為 5。數值越低，在低速時動作幅度越深。
// strokeMax：裝置行程上限（0–100）。預設值為 65。數值越高，在低速時收回幅度越大。
// 這兩個數值會隨每個 UDP 訊息傳送，橋接程式會根據它們計算完整動作範圍。
// 準備/結束時的停放位置固定使用 strokeMax（收回位置）。預設值與原本寫死的設定一致。
strokeMin=5
strokeMax=65

// readyAndFinishDelay：裝置停放時，在最高停放位置震盪的時間（毫秒）。
// （包含開啟服務選單以及自然結束後）完全停止前的時間。預設值 2000（2 秒）。
readyAndFinishDelay=2000

