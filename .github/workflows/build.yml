name: Build and Package

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore NoCoolCoffee.csproj

    - name: Build Solution
      run: dotnet build NoCoolCoffee.csproj -c Release --no-restore

    - name: Prepare Packaging Directory
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path ./package/scripts -Force
        Copy-Item -Path ./bin/Release/CinnamonCoffee.dll -Destination ./package/scripts/ -Force
        Copy-Item -Path ./CinnamonCoffee.cfg -Destination ./package/scripts/ -Force
        Copy-Item -Path ./CinnamonCoffeeALife.ini -Destination ./package/scripts/ -Force
        Copy-Item -Path ./README.md -Destination ./package/ -Force
        Compress-Archive -Path ./package/* -DestinationPath ./CinnamonRendezvous-v1.2.zip -Force

    - name: Upload Build Artifact (Zip Package)
      uses: actions/upload-artifact@v4
      with:
        name: CinnamonRendezvous-v1.2
        path: CinnamonRendezvous-v1.2.zip
        if-no-files-found: error

    - name: Create Release (Tag only)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: CinnamonRendezvous-v1.2.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
